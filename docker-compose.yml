services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: srm-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/srm-credit-engine-realm.json:/opt/keycloak/data/import/srm-credit-engine-realm.json:ro
    restart: no
  postgres:
    image: postgres:16-alpine
    container_name: srm-postgres
    environment:
      POSTGRES_USER: srm
      POSTGRES_PASSWORD: srm
      POSTGRES_DB: srm
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    restart: no
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srm -d srm"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend/ms-backend
      dockerfile: Dockerfile
    container_name: spring-backend
    restart: no
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/srm
      SPRING_DATASOURCE_USERNAME: srm
      SPRING_DATASOURCE_PASSWORD: srm
      # O token é emitido para o endereço público acessado pelo navegador.
      # As chaves, porém, são buscadas pela rede interna do Compose.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/srm-credit-engine
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/srm-credit-engine/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: svelte-frontend
    restart: no
    ports:
      - "80:80"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - backend
